
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>IPL Ticket Booking Form</h1>

    <form action="#" method="get">

        <!-- Name -->
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"
               pattern="[A-Za-z ]+"
               minlength="3" maxlength="30"
               title="Name should contain only letters and spaces"
               required>

        <br><br>

        <!-- Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <!-- Phone Number -->
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone"
               pattern="[0-9]{10}"
               minlength="10" maxlength="10"
               title="Please enter exactly 10 digits"
               required>

        <br><br>

        <!-- Match Selection -->
        <label for="match">Select Match:</label>
        <select id="match" name="match" required>
            <option value="">Select Match</option>
            <option value="RCB vs CSK">RCB vs CSK</option>
            <option value="MI vs KKR">MI vs KKR</option>
            <option value="SRH vs DC">SRH vs DC</option>
        </select>

        <br><br>

        <!-- Stand Category -->
        <label for="stand">Stand Category:</label>
        <select id="stand" name="stand" required>
            <option value="">Select Stand</option>
            <option value="General">General</option>
            <option value="Premium">Premium</option>
            <option value="VIP">VIP</option>
        </select>

        <br><br>

        <!-- Number of Tickets -->
        <label for="tickets">Number of Tickets:</label>
        <input type="number" id="tickets" name="tickets"
               min="1" max="10" required>

        <br><br>

        <!-- Additional Preference -->
        <p>Additional Preference:</p>

        <input type="radio" id="online" name="preference"
               value="Online Payment" required>
        <label for="online">Online Payment</label>

        <input type="radio" id="counter" name="preference"
               value="Counter Payment">
        <label for="counter">Counter Payment</label>

        <br><br>

        <!-- Submit and Reset -->
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
